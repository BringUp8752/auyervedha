main{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}

.card b{font-size:14px;line-height:1.3;min-height:36px}
.card small{color:var(--mu)}
.pr{font-weight:700;font-size:16px}

.row button{padding:2px 8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:4px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}
.modal div{background:var(--sf);padding:20px;border-radius:10px;width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
.modal input{padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.note{font-size:12px;color:var(--mu)}
.modal select{padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.modal #mb{max-height:92vh;overflow:auto}.modal #mb.wide{width:min(520px,100%)}
.offer{background:var(--sf);border:1px dashed var(--ac2);color:var(--tx);padding:7px 12px;border-radius:20px;cursor:pointer;font-size:13px}
.modal svg{width:100%;height:auto;border-radius:8px}
.dl{cursor:pointer}.dl:hover{text-decoration:underline}
@media(max-width:700px){.wrap{flex-direction:column}aside{flex:none;width:100%}}

if(!v.name||!v.line1||!v.city){m.textContent="Please fill your name, address and city.";return}
if(!/^[6-9]\d{9}$/.test(v.phone)){m.textContent="Enter a valid 10-digit mobile number.";return}
if(!/^[1-9]\d{5}$/.test(v.pin)){m.textContent="Enter a valid 6-digit PIN code.";return}
try{localStorage.setItem("addr",JSON.stringify(v))}catch(e){}upiScreen(v)}}
function upiScreen(a,msg){var amt=$("tot").textContent,link=CFG.upiId?"upi://pay?pa="+encodeURIComponent(CFG.upiId)+"&pn="+encodeURIComponent(CFG.upiName)+"&am="+amt+"&cu=INR&tn="+encodeURIComponent("Order payment"):"";
modal('<h3 style="margin:0">Pay with UPI</h3><p style="margin:0">Amount to pay: <b style="font-size:20px">₹'+amt+'</b></p>'
+'<img id="qr" src="/upi-qr.png" alt="UPI QR code" style="width:min(240px,100%);align-self:center;border:1px solid var(--bd);border-radius:8px">'
+(CFG.upiId?'<p class="note" style="margin:0;text-align:center">UPI ID: <b>'+esc(CFG.upiId)+'</b></p>':'')
+(link?'<a class="pay" href="'+link+'" style="text-align:center;text-decoration:none;display:block;padding:9px">Open UPI app (on phone)</a>':'')
+'<p class="note" style="margin:0">1. Scan the QR code (or use the button) and pay exactly ₹'+amt+'.<br>2. Copy the <b>UPI transaction ID / UTR</b> from your payment app.<br>3. Enter it below. We check our bank account and confirm your order.</p>'
+'<input id="u_t" placeholder="UPI transaction ID (UTR)" autocomplete="off" style="text-transform:uppercase">'
+'<p class="note" id="u_m" style="color:#c62828;margin:0">'+esc(msg||"")+'</p>'
+'<button class="pay" id="u_go">I have paid — place order</button><button class="row" id="u_bk" style="width:100%">Back</button>',true);
$("qr").onerror=function(){this.style.display="none"};
$("u_bk").onclick=function(){addrForm("",a)};
$("u_go").onclick=async function(){var u=$("u_t").value.trim().toUpperCase(),b=$("u_go");
if(!/^[A-Z0-9]{8,30}$/.test(u)){$("u_m").textContent="Enter the transaction ID shown in your UPI app (letters and numbers only).";return}
b.disabled=true;b.textContent="Placing order…";var r=await placeOrder(a,u);
if(r.ok){cart={};drawCart();$("dr").classList.remove("on");modal('<h3 style="margin:0">Order received ✓</h3><p style="margin:0">Order <b>#'+r.id+'</b> · ₹'+r.total+'</p><p class="note" style="margin:0">We will check your UPI payment and confirm. You can follow the payment and delivery status under your name (top right) → My orders.</p><button class="pay" onclick="document.getElementById(\'m\').classList.remove(\'on\')">Close</button>')}
else if(r.status==401){signOut();sign("login","","Your session expired. Please sign in again.")}
else{b.disabled=false;b.textContent="I have paid — place order";$("u_m").textContent=r.error||"Could not place the order. Please try again."}}}
$("pp").onclick=function(){if(!Object.keys(cart).length)return;if(!user){sign();return}addrForm()};
function showDetail(i){var p=byId(i);if(!p)return;
var im=p.im?'<img alt="'+esc(p.n)+'" src="'+p.im+'" style="width:100%;max-height:280px;object-fit:contain;border-radius:8px">':img(p);
modal('<section style="display:flex;gap:14px;flex-wrap:wrap"><span style="flex:1 1 200px;min-width:180px">'+im+'</span><span style="flex:1 1 200px;display:flex;flex-direction:column;gap:6px"><h3 style="margin:0">'+esc(p.n)+'</h3><span class="note">'+esc(p.b||"")+' · '+esc(p.c)+'</span><span class="pr" style="font-size:22px">₹'+p.p+'</span><button class="pay" id="dadd">Add to cart</button></span></section>'
+'<p style="margin:0"><b>About this product</b><br>'+esc(p.d||"Traditional Kerala Ayurvedic product.")+'</p>'
+'<p style="margin:0"><b>How to use / dosage</b><br>'+esc(p.u||"Use as directed by your Ayurvedic physician or as printed on the product label.")+'</p>'
+'<p class="note" style="margin:0">Ayurvedic products are not a substitute for medical advice. Please consult a qualified Ayurvedic physician before use, especially during pregnancy, for children, or if you take other medicines.</p>'
+'<button class="row" id="dcl" style="width:100%">Close</button>',true);
$("dadd").onclick=function(){cart[p.id]=(cart[p.id]||0)+1;drawCart();$("m").classList.remove("on");$("dr").classList.add("on")};
$("dcl").onclick=function(){$("m").classList.remove("on")}}
function loadOffers(){fetch("/api/offers").then(function(r){return r.json()}).then(function(o){if(!Array.isArray(o)||!o.length){$("offers").innerHTML="";return}
$("offers").innerHTML='<section style="max-width:1200px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap">'+o.map(function(x){return'<button class="offer" data-oc="'+esc(x.code)+'">🏷️ <b>'+esc(x.code)+'</b> — '+x.pct+'% off'+(x.min?' on orders above ₹'+x.min:'')+(x.note?' · '+esc(x.note):'')+'</button>'}).join("")+'</section>'}).catch(function(){})}
function byId(i){return P.filter(function(x){return x.id==i})[0]}
var editD=0,AK=sessionStorage.getItem("ak")||"",coup=null,tab="p",od=[],cd=[];
function api(m,u,b){return fetch(u,{method:m,headers:{"content-type":"application/json","x-admin-key":AK},body:b?JSON.stringify(b):undefined}).then(function(r){return r.ok?r.json():Promise.reject(r)})}
var _i=img;img=function(p){return p.im?'<img alt="" src="'+p.im+'" style="width:100%;height:120px;object-fit:cover;border-radius:6px">':_i(p)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function admOn(){return $("adm").classList.contains("on")}
function load(){return api("GET",AK?"/api/admin/products":"/api/products").catch(function(){return api("GET","/api/products")}).then(function(a){P.length=0;a.forEach(function(x){P.push(x)});render();drawCart()})}
function refresh(){return Promise.all([api("GET","/api/admin/orders"),api("GET","/api/admin/coupons"),load()]).then(function(r){od=r[0];cd=r[1];showAdm()})}
function savep(id,patch){return api("PATCH","/api/admin/products/"+id,patch).then(load).then(function(){if(admOn())showAdm()})}
function toURL(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result)};f.readAsDataURL(b)})}
async function shrink(f){try{var b=await createImageBitmap(f),s=Math.min(1,600/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*s;c.height=b.height*s;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return await toURL(await new Promise(function(r){c.toBlob(r,"image/jpeg",.8)}))}catch(e){return toURL(f)}}
async function addP(){var n=$("np_n").value.trim(),pr=+$("np_p").value;if(!n||!pr)return;var f=$("np_f").files[0],im=f?await shrink(f):null;
await api("POST","/api/admin/products",{n:n,c:$("np_c").value,b:$("np_b").value,p:pr,im:im});refresh()}
async function bulk(fs){for(var i=0;i<fs.length;i++){var m=fs[i].name.match(/^(\d+)/);if(!m||!byId(+m[1]))continue;try{await api("PATCH","/api/admin/products/"+m[1],{im:await shrink(fs[i])})}catch(e){}}refresh()}
function placeOrder(a,utr){var it=Object.keys(cart).map(function(i){return{id:+i,q:cart[i]}}),cok=coup&&SUB>=(coup.min||0);
return fetch("/api/orders",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+tk},body:JSON.stringify({name:a.name,phone:a.phone,line1:a.line1,line2:a.line2,city:a.city,state:a.state,pin:a.pin,utr:utr,coupon:cok?coup.code:"",items:it})}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){d.ok=r.ok;d.status=r.status;return d})}).catch(function(){return{ok:false,error:"Network problem. Please try again."}})}
function edh(){var e=editD&&byId(editD);return e?'<p style="border:1px solid var(--bd);padding:8px;border-radius:8px"><b>Details: '+esc(e.n)+'</b><br><textarea id="pd_d" rows="3" style="width:100%" placeholder="About this product">'+esc(e.d||"")+'</textarea><textarea id="pd_u" rows="3" style="width:100%" placeholder="How to use / dosage (copy it from the manufacturer label)">'+esc(e.u||"")+'</textarea><button data-act="pds">Save details</button> <button data-act="pdx">Cancel</button></p>':""}
function showAdm(){var h='<p><button data-t="p">Products</button> <button data-t="c">Coupons</button> <button data-t="o">Orders ('+od.length+')</button> <button data-t="x">Close</button></p>',
cs=CATS.map(function(c){return'<option>'+c[0]+'</option>'}).join(""),bs=BR.map(function(b){return'<option>'+b+'</option>'}).join("");
if(tab=="p"){h+=edh()+'<p><b>Add product</b><br><input id="np_n" placeholder="Name"> <select id="np_c">'+cs+'</select> <select id="np_b">'+bs+'</select> <input id="np_p" type="number" placeholder="Price ₹" style="width:90px"> <input id="np_f" type="file" accept="image/*"> <button data-act="add">Add</button></p><p><b>Bulk photos</b> (name files 1.jpg to 100.jpg): <input id="bk" type="file" accept="image/*" multiple></p><table style="width:100%;font-size:13px">'+P.map(function(p){return'<tr><td>'+p.id+'</td><td>'+esc(p.n)+'</td><td><input data-pp="'+p.id+'" type="number" value="'+p.p+'" style="width:70px"></td><td><input data-pi="'+p.id+'" type="file" accept="image/*" style="width:150px"></td><td><label><input data-ph="'+p.id+'" type="checkbox"'+(p.h?' checked':'')+'> hide</label></td><td><button data-pd="'+p.id+'">Details</button></td><td><button data-pdel="'+p.id+'">Delete</button></td></tr>'}).join("")+'</table>'}
else if(tab=="c"){h+='<p><b>Add coupon / offer</b><br><input id="cu_c" placeholder="CODE" style="width:100px"> <input id="cu_p" type="number" placeholder="% off" style="width:70px"> <input id="cu_m" type="number" placeholder="Min order ₹" style="width:100px"> <input id="cu_n" placeholder="Offer text (optional)" style="width:180px"> <label>Expires <input id="cu_e" type="date"></label> <label><input id="cu_s" type="checkbox" checked> Show on store</label> <button data-act="ac">Save coupon</button></p>'+(cd.map(function(c){var k=esc(c.code);return'<p style="border-bottom:1px solid var(--bd);font-size:13px"><b>'+k+'</b> — '+c.percent_off+'% off'+(c.min_order?' above ₹'+c.min_order:'')+(c.expires_at?' · expires '+new Date(c.expires_at).toLocaleDateString():'')+' · '+(c.active?'ON':'OFF')+' · '+(c.public?'shown on store':'hidden')+'<br><button data-ct="'+k+'">Turn on/off</button> <button data-cs="'+k+'" data-cv="'+(c.public?0:1)+'">'+(c.public?'Hide from store':'Show on store')+'</button> <button data-cd="'+k+'">Delete</button></p>'}).join("")||'<p>No coupons yet.</p>')}
else{h+=od.map(function(o){var paid=o.ps=="Paid";return'<p style="border-bottom:1px solid var(--bd);font-size:13px"><b>#'+o.id+' · '+new Date(o.ts).toLocaleString()+'</b> · '+esc(o.nm||"")+' · '+esc(o.ph||"")+' · '+esc(o.email||"guest")+'<br>'+o.items.map(function(i){return esc(i.n)+' ×'+i.q}).join(", ")+'<br>Total <b>₹'+o.total+'</b>'+(o.coupon?' (coupon '+esc(o.coupon)+')':'')+'<br>'+esc(o.address||"")+'<br>UTR: <b>'+esc(o.utr||"—")+'</b> · Payment: <b>'+esc(o.ps||"")+'</b> '+(o.utr&&o.ps=="Awaiting verification"?'<button data-pay="'+o.id+'" data-pv="Paid">Mark payment received</button> <button data-pay="'+o.id+'" data-pv="Rejected">Reject</button>':'')+'<br>Order status: <select data-os="'+o.id+'"'+(paid||o.status=="Cancelled"?'':' disabled')+'>'+["New","Packed","Shipped","Delivered","Cancelled"].map(function(x){return'<option'+(x==o.status?' selected':'')+'>'+x+'</option>'}).join("")+'</select></p>'}).join("")||'<p>No orders yet.</p>'}
$("ab").innerHTML=h}
$("ab").onclick=function(e){var t=e.target.dataset;
if(t.t){if(t.t=="x")$("adm").classList.remove("on");else{tab=t.t;showAdm()}}
if(t.act=="add")addP();
if(t.act=="ac")api("POST","/api/admin/coupons",{code:$("cu_c").value.trim(),pct:+$("cu_p").value,min:+$("cu_m").value||0,note:$("cu_n").value.trim(),expires:$("cu_e").value,pub:$("cu_s").checked}).then(function(){return refresh()}).then(loadOffers).catch(function(){alert("Check the coupon code and the % off (1 to 100).")});
if(t.cs)api("PATCH","/api/admin/coupons/"+encodeURIComponent(t.cs),{pub:t.cv=="1"}).then(refresh).then(loadOffers);
if(t.pay&&confirm(t.pv=="Paid"?"Mark payment as RECEIVED for order #"+t.pay+"? Check your bank / UPI app first.":"Reject this payment? The order will be cancelled."))api("PATCH","/api/admin/orders/"+t.pay+"/payment",{status:t.pv}).then(refresh);
if(t.pd){editD=t.pd;showAdm()}
if(t.act=="pdx"){editD=0;showAdm()}
if(t.act=="pds"){var ei=editD;savep(ei,{d:$("pd_d").value.trim(),u:$("pd_u").value.trim()}).then(function(){editD=0;showAdm()})}
if(t.cd)api("DELETE","/api/admin/coupons/"+encodeURIComponent(t.cd)).then(refresh).then(loadOffers);
if(t.ct)api("PATCH","/api/admin/coupons/"+encodeURIComponent(t.ct)).then(refresh).then(loadOffers);
if(t.pdel&&confirm("Delete this product? (If it has orders it is hidden instead.)"))api("DELETE","/api/admin/products/"+t.pdel).then(refresh)};
$("ab").onchange=function(e){var x=e.target,t=x.dataset;
if(t.pp)savep(t.pp,{p:+x.value});
if(t.ph)savep(t.ph,{h:x.checked});
if(t.pi&&x.files[0])shrink(x.files[0]).then(function(u){savep(t.pi,{im:u})});
if(t.os)api("PATCH","/api/admin/orders/"+t.os,{status:x.value}).catch(function(){alert("Verify the payment first.");refresh()});
if(x.id=="bk")bulk(x.files)};
$("ad").onclick=function(){if(!AK)AK=prompt("Admin key")||"";
refresh().then(function(){sessionStorage.setItem("ak",AK);tab="p";$("adm").classList.add("on")}).catch(function(){AK="";sessionStorage.removeItem("ak");alert("Wrong admin key")})};
$("ac").onclick=function(){var c=$("cc").value.trim();fetch("/api/coupon/"+encodeURIComponent(c)).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(d){coup={code:c.toUpperCase(),pct:d.pct,min:d.min||0};drawCart()}).catch(function(){coup=null;drawCart();$("cm").textContent="Invalid coupon"})};
load().catch(function(){});render();drawCart();loadOffers();
</script></body></html>
